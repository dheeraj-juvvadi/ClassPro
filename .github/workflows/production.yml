name: Validate and deploy Azure
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: production-${{ github.ref }}
  cancel-in-progress: false
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      backend: ${{ steps.scope.outputs.backend }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Verify deployment scope
        run: node --test scripts/ci-scope.test.mjs
      - name: Detect changed services
        id: scope
        run: node scripts/ci-scope.mjs
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        if: steps.scope.outputs.frontend == 'true'
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: portal-app/package-lock.json
      - run: npm ci
        if: steps.scope.outputs.frontend == 'true'
        working-directory: portal-app
      - run: npx playwright install --with-deps chromium
        if: steps.scope.outputs.frontend == 'true'
        working-directory: portal-app
      - run: npm run build && npm run test:release
        if: steps.scope.outputs.frontend == 'true'
        working-directory: portal-app
      - run: docker build -f ratio-diagnostic/Dockerfile -t anon-test .
        if: steps.scope.outputs.backend == 'true'
      - run: docker run --rm --network none -e APP_ORIGIN=http://localhost:8089 anon-test python -m unittest discover
        if: steps.scope.outputs.backend == 'true'
  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && needs.validate.outputs.backend == 'true'
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Deploy tested revision
        env:
          DEPLOY_KEY: ${{ secrets.AZURE_DEPLOY_KEY }}
          KNOWN_HOSTS: ${{ secrets.AZURE_KNOWN_HOSTS }}
          DEPLOY_HOST: ${{ vars.AZURE_DEPLOY_HOST }}
        run: |
          set -euo pipefail
          install -d -m 700 ~/.ssh
          printf '%s\n' "$DEPLOY_KEY" > ~/.ssh/anon_deploy
          chmod 600 ~/.ssh/anon_deploy
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          git archive --format=tar.gz HEAD ratio-diagnostic portal-python/ocr.py portal-python/model |
            ssh -i ~/.ssh/anon_deploy -o BatchMode=yes -o StrictHostKeyChecking=yes "azureuser@$DEPLOY_HOST" "$GITHUB_SHA"
          rm -f ~/.ssh/anon_deploy
      - name: Verify public service
        run: curl --fail --retry 3 --retry-delay 3 https://anon-tracker.vercel.app/api/session
